name: Scrape JioMart prices

on:
  # Schedule paused 2026-10-01: every run since 2026-09-30 has hit the exact
  # same 30s-timeout-on-every-term block from this home IP, both locations,
  # with only one clean success before that (2026-09-28). Each guaranteed-
  # fail attempt still ties up the single zepto-home runner for ~5-6 min,
  # delaying Zepto/Blinkit/DMart behind it for no benefit. Re-enable the
  # schedule once the block is understood (different IP? longer cooldown?) —
  # workflow_dispatch below still works for a one-off manual test meanwhile.
  # schedule:
  #   - cron: '15 3,11,19 * * *'
  workflow_dispatch: {}

# Never let two JioMart sweeps overlap (they write the same rows).
concurrency:
  group: scrape-jiomart
  cancel-in-progress: false

jobs:
  scrape:
    # Runs on the self-hosted zepto-home runner, not ubuntu-latest: two runs
    # from GitHub-hosted IPs (2026-09-26, 2026-09-28) both showed the same
    # shape of soft block Zepto hit — the first few search terms came back
    # with suspiciously empty results, then almost every later term simply
    # timed out waiting for JioMart's own response (30s, no error, no data).
    # Local runs from a home IP return real results in ~5s/term (verified).
    #
    # This runner isn't installed as a Windows service — it only runs while
    # someone has run.cmd open in an interactive session on that machine.
    # If zepto-home-runner isn't online when this fires, the job just queues
    # until it is (or until the run is cancelled) rather than failing.
    runs-on: [self-hosted, zepto-home]
    # Sweep length unknown until the first successful run; 3h cap stops a runaway.
    timeout-minutes: 180
    steps:
      # Plain git clone instead of actions/checkout@v4 — see scrape-zepto.yml:
      # that action's own post-job cleanup reliably throws EBUSY on this
      # Windows runner even after a successful checkout.
      - name: Checkout fork
        shell: powershell
        run: |
          if (Test-Path repo) { Remove-Item -Recurse -Force repo }
          git clone --depth 1 https://x-access-token:${{ secrets.REPO_PAT }}@github.com/tvsharish/price-app-mobile.git repo

      - name: Sync fork with upstream
        continue-on-error: true
        shell: powershell
        working-directory: repo
        run: |
          git remote add upstream https://x-access-token:${{ secrets.REPO_PAT }}@github.com/rama-gorantla/price-app-mobile.git
          git fetch upstream main
          git reset --hard upstream/main

      - name: Install dependencies
        working-directory: repo/scrapers
        shell: powershell
        run: npm install

      - name: Install Chromium
        working-directory: repo/scrapers
        shell: powershell
        run: npx playwright install chromium

      - name: Run JioMart scraper
        working-directory: repo/scrapers
        shell: powershell
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run scrape:jiomart
