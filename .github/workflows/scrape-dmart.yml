name: Scrape DMart prices

on:
  schedule:
    - cron: '30 1,9,17 * * *'
  workflow_dispatch: {}

# Never let two DMart sweeps overlap (they write the same rows).
concurrency:
  group: scrape-dmart
  cancel-in-progress: false

jobs:
  scrape:
    # Runs on the self-hosted zepto-home runner, not ubuntu-latest: the
    # first two runs from GitHub-hosted IPs (2026-09-26, 2026-09-28) both
    # timed out opening DMart's pincode picker (see scrapers/dmart/lib.mjs's
    # resolveStoreId) before ever reaching search, same shape of block as
    # Zepto's. Home IP resolves storeId fine (verified locally).
    #
    # This runner isn't installed as a Windows service — it only runs while
    # someone has run.cmd open in an interactive session on that machine.
    # If zepto-home-runner isn't online when this fires, the job just queues
    # until it is (or until the run is cancelled) rather than failing.
    runs-on: [self-hosted, zepto-home]
    # Sweep length unknown until the first successful run; 3h cap stops a runaway.
    timeout-minutes: 180
    steps:
      # Plain git clone instead of actions/checkout@v4 — see scrape-zepto.yml:
      # that action's own post-job cleanup reliably throws EBUSY on this
      # Windows runner even after a successful checkout.
      - name: Checkout fork
        shell: powershell
        run: |
          if (Test-Path repo) { Remove-Item -Recurse -Force repo }
          git clone --depth 1 https://x-access-token:${{ secrets.REPO_PAT }}@github.com/tvsharish/price-app-mobile.git repo

      - name: Sync fork with upstream
        continue-on-error: true
        shell: powershell
        working-directory: repo
        run: |
          git remote add upstream https://x-access-token:${{ secrets.REPO_PAT }}@github.com/rama-gorantla/price-app-mobile.git
          git fetch upstream main
          git reset --hard upstream/main

      - name: Install dependencies
        working-directory: repo/scrapers
        shell: powershell
        run: npm install

      - name: Install Chromium
        working-directory: repo/scrapers
        shell: powershell
        run: npx playwright install chromium

      - name: Run DMart scraper
        working-directory: repo/scrapers
        shell: powershell
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run scrape:dmart
