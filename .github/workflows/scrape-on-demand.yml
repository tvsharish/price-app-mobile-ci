name: On-demand scrape (single term)

on:
  repository_dispatch:
    types: [scrape-term]

# Collapses duplicate dispatches for the same term + location (a user retyping a
# search, or gap-fill re-picking a gap) into one pending run instead of stacking.
concurrency:
  group: on-demand-${{ github.event.client_payload.term }}-${{ github.event.client_payload.lat }}-${{ github.event.client_payload.lng }}
  cancel-in-progress: false

jobs:
  # This repo is public purely so its Actions minutes are free — see
  # README.md. supabase/functions/search-products' GH_REPO secret must point
  # here (tvsharish/price-app-mobile-ci), not at the private repo, since
  # that's what search-products' repository_dispatch call actually targets.
  # The real code lives in tvsharish's own fork (checked out below), kept
  # current via the sync step, so this stays usable even if collaborator
  # access to the rama-gorantla original is ever lost.

  # Only Instamart left on GitHub-hosted infra — Zepto and Blinkit both got
  # moved to the self-hosted runner (see their own jobs below) once each
  # started hitting a CDN-level 403 specifically from GitHub's IP range.
  scrape-instamart:
    runs-on: ubuntu-latest
    # Single-term Instamart takes 1-2 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tvsharish/price-app-mobile
          token: ${{ secrets.REPO_PAT }}

      - name: Sync fork with upstream
        continue-on-error: true
        run: |
          git remote add upstream https://x-access-token:${{ secrets.REPO_PAT }}@github.com/rama-gorantla/price-app-mobile.git
          git fetch upstream main
          git reset --hard upstream/main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: scrapers
        run: npm install

      - name: Install Chromium
        working-directory: scrapers
        run: npx playwright install --with-deps chromium

      - name: Scrape single term (Instamart)
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_TERM: ${{ github.event.client_payload.term }}
          SCRAPE_LAT: ${{ github.event.client_payload.lat }}
          SCRAPE_LNG: ${{ github.event.client_payload.lng }}
        run: npm run scrape:instamart:single

  # Separate job, separate runner: Blinkit's search page gets a Cloudflare
  # 403 from every GitHub-hosted runner IP tested since 2026-09-02, but works
  # fine from a home connection — same root cause as Zepto's CloudFront
  # block, different site. See scrape-blinkit.yml. If zepto-home-runner isn't
  # online when this fires, only this job queues/waits; Instamart above still
  # runs normally on GitHub-hosted infra regardless.
  scrape-blinkit:
    runs-on: [self-hosted, zepto-home]
    # Single-term Blinkit takes well under a minute; 20 min only frees a hung runner.
    timeout-minutes: 20
    steps:
      # Plain git clone + powershell instead of actions/checkout@v4 + bash —
      # see scrape-zepto.yml for why (EBUSY on checkout's own cleanup; bash
      # resolves to WSL on this runner and mangles Windows paths).
      - name: Checkout fork
        shell: powershell
        run: |
          if (Test-Path repo) { Remove-Item -Recurse -Force repo }
          git clone --depth 1 https://x-access-token:${{ secrets.REPO_PAT }}@github.com/tvsharish/price-app-mobile.git repo

      - name: Sync fork with upstream
        continue-on-error: true
        shell: powershell
        working-directory: repo
        run: |
          git remote add upstream https://x-access-token:${{ secrets.REPO_PAT }}@github.com/rama-gorantla/price-app-mobile.git
          git fetch upstream main
          git reset --hard upstream/main

      - name: Install dependencies
        working-directory: repo/scrapers
        shell: powershell
        run: npm install

      - name: Install Chromium
        working-directory: repo/scrapers
        shell: powershell
        run: npx playwright install chromium

      - name: Scrape single term (Blinkit)
        working-directory: repo/scrapers
        shell: powershell
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_TERM: ${{ github.event.client_payload.term }}
          SCRAPE_LAT: ${{ github.event.client_payload.lat }}
          SCRAPE_LNG: ${{ github.event.client_payload.lng }}
        run: npm run scrape:blinkit:single

  # Separate job, separate runner: Zepto's category pages get a CloudFront
  # 403 from every GitHub-hosted runner IP tested, but work from a home
  # connection — see scrape-zepto.yml. If zepto-home-runner isn't online
  # when this fires, only this job queues/waits; Instamart above still runs
  # normally on GitHub-hosted infra regardless.
  #
  # Was paused 2026-09-20 for a CloudFront 429 rate-limit cooldown on the
  # home IP, and separately hit an AWS WAF JS challenge specifically under
  # headless Chromium — see scrape-zepto.yml for the full story. Both are
  # addressed now (stop-on-429 + headful by default) and re-enabled
  # 2026-09-20 after a clean local run through 10+ categories.
  scrape-zepto:
    runs-on: [self-hosted, zepto-home]
    # Single-category Zepto takes under a few minutes; 20 min only frees a hung runner.
    timeout-minutes: 20
    steps:
      - name: Checkout fork
        shell: powershell
        run: |
          if (Test-Path repo) { Remove-Item -Recurse -Force repo }
          git clone --depth 1 https://x-access-token:${{ secrets.REPO_PAT }}@github.com/tvsharish/price-app-mobile.git repo

      - name: Sync fork with upstream
        continue-on-error: true
        shell: powershell
        working-directory: repo
        run: |
          git remote add upstream https://x-access-token:${{ secrets.REPO_PAT }}@github.com/rama-gorantla/price-app-mobile.git
          git fetch upstream main
          git reset --hard upstream/main

      - name: Install dependencies
        working-directory: repo/scrapers
        shell: powershell
        run: npm install

      - name: Install Chromium
        working-directory: repo/scrapers
        shell: powershell
        run: npx playwright install chromium

      - name: Scrape single term (Zepto)
        working-directory: repo/scrapers
        shell: powershell
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_TERM: ${{ github.event.client_payload.term }}
          SCRAPE_LAT: ${{ github.event.client_payload.lat }}
          SCRAPE_LNG: ${{ github.event.client_payload.lng }}
        run: npm run scrape:zepto:single
