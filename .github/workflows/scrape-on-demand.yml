name: On-demand scrape (single term)

on:
  repository_dispatch:
    types: [scrape-term]

jobs:
  # This repo is public purely so its Actions minutes are free — see
  # README.md. supabase/functions/search-products' GH_REPO secret must point
  # here (tvsharish/price-app-mobile-ci), not at the private repo, since
  # that's what search-products' repository_dispatch call actually targets.
  # The real code lives in tvsharish's own fork (checked out below), kept
  # current via the sync step, so this stays usable even if collaborator
  # access to the rama-gorantla original is ever lost.

  # Instamart + Blinkit share one job on purpose: checkout + npm install +
  # Chromium download is the bulk of the runtime, so running them as separate
  # jobs would roughly double the Actions minutes this burns per dispatch.
  scrape-instamart-blinkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tvsharish/price-app-mobile
          token: ${{ secrets.REPO_PAT }}

      - name: Sync fork with upstream
        continue-on-error: true
        run: |
          git remote add upstream https://x-access-token:${{ secrets.REPO_PAT }}@github.com/rama-gorantla/price-app-mobile.git
          git fetch upstream main
          git reset --hard upstream/main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: scrapers
        run: npm install

      - name: Install Chromium
        working-directory: scrapers
        run: npx playwright install --with-deps chromium

      - name: Scrape single term (Instamart)
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_TERM: ${{ github.event.client_payload.term }}
          SCRAPE_LAT: ${{ github.event.client_payload.lat }}
          SCRAPE_LNG: ${{ github.event.client_payload.lng }}
        run: npm run scrape:instamart:single

      # always() so an Instamart failure doesn't silently skip Blinkit.
      - name: Scrape single term (Blinkit)
        if: always()
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_TERM: ${{ github.event.client_payload.term }}
          SCRAPE_LAT: ${{ github.event.client_payload.lat }}
          SCRAPE_LNG: ${{ github.event.client_payload.lng }}
        run: npm run scrape:blinkit:single

  # Separate job, separate runner: Zepto's category pages get a CloudFront
  # 403 from every GitHub-hosted runner IP tested, but work from a home
  # connection — see scrape-zepto.yml. If zepto-home-runner isn't online
  # when this fires, only this job queues/waits; Instamart and Blinkit above
  # still run normally on GitHub-hosted infra regardless.
  scrape-zepto:
    runs-on: [self-hosted, zepto-home]
    steps:
      # Plain git clone instead of actions/checkout@v4 — that action's own
      # post-job temp-directory cleanup reliably throws
      # "EBUSY: resource busy or locked" on this Windows runner (a known
      # actions/checkout-on-Windows issue), failing the whole job even
      # though the checkout itself had already succeeded. See scrape-zepto.yml.
      #
      # PowerShell, not bash: this machine has WSL installed alongside Git
      # Bash, and `shell: bash` resolved to WSL's bash.exe, which mangles
      # Windows-style paths. PowerShell is unambiguous on a Windows runner.
      - name: Checkout fork
        shell: powershell
        run: |
          if (Test-Path repo) { Remove-Item -Recurse -Force repo }
          git clone --depth 1 https://x-access-token:${{ secrets.REPO_PAT }}@github.com/tvsharish/price-app-mobile.git repo

      - name: Sync fork with upstream
        continue-on-error: true
        shell: powershell
        working-directory: repo
        run: |
          git remote add upstream https://x-access-token:${{ secrets.REPO_PAT }}@github.com/rama-gorantla/price-app-mobile.git
          git fetch upstream main
          git reset --hard upstream/main

      - name: Install dependencies
        working-directory: repo/scrapers
        shell: powershell
        run: npm install

      - name: Install Chromium
        working-directory: repo/scrapers
        shell: powershell
        run: npx playwright install chromium

      - name: Scrape single term (Zepto)
        working-directory: repo/scrapers
        shell: powershell
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_TERM: ${{ github.event.client_payload.term }}
          SCRAPE_LAT: ${{ github.event.client_payload.lat }}
          SCRAPE_LNG: ${{ github.event.client_payload.lng }}
        run: npm run scrape:zepto:single
