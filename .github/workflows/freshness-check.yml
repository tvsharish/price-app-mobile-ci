name: Check price freshness

# Fails (turning this run red, which makes GitHub email whoever last edited
# this cron) when any enabled store's newest price is older than
# FRESHNESS_MAX_HOURS (default 12). A Zepto outage once ran ~11 days unseen
# because the scraper reported success on empty pages and nothing watched the
# data itself — this watches the data. It catches every cause at once: an
# offline runner, a block/rate limit, a layout change, a hung job.
#
# Optional secret ALERT_WEBHOOK_URL (Slack/Discord/ntfy/any JSON POST endpoint)
# adds an instant message on top of the email. Not required.
on:
  schedule:
    - cron: '47 */6 * * *'  # every 6 hours, off the hour
  workflow_dispatch: {}

concurrency:
  group: freshness-check
  cancel-in-progress: false

jobs:
  check:
    # Runs on GitHub-hosted infra on purpose — it must keep working when the
    # home runner is exactly what's broken.
    runs-on: ubuntu-latest
    # Takes a few seconds; this only stops a hang from lingering.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tvsharish/price-app-mobile
          token: ${{ secrets.REPO_PAT }}

      - name: Sync fork with upstream
        continue-on-error: true
        run: |
          git remote add upstream https://x-access-token:${{ secrets.REPO_PAT }}@github.com/rama-gorantla/price-app-mobile.git
          git fetch upstream main
          git reset --hard upstream/main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: scrapers
        run: npm install --omit=dev --no-audit --no-fund

      - name: Check freshness of every store's newest price
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: npm run freshness-check
