name: Scrape Blinkit prices

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    # This repo is public purely so its Actions minutes are free (private-repo
    # minutes are capped at 2,000/month on GitHub Free, and the real
    # price-app-mobile repo blew through that). The actual code lives in
    # tvsharish's own fork of it (not the rama-gorantla original) so this
    # pipeline stays usable even if collaborator access to the original is
    # ever lost — see the sync step below and README.md.
    #
    # The original assumption was that Blinkit needed TLS impersonation and a
    # paid proxy (Cloudflare-style 403 on a plain fetch). Confirmed by direct
    # testing that assumption was wrong: the exact same stealth-Playwright
    # recipe already used for Instamart gets straight through, and location
    # is even simpler (plain cookies, no location-select UI flow).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tvsharish/price-app-mobile
          token: ${{ secrets.REPO_PAT }}

      # Best-effort: keeps the fork's code current with upstream on every
      # run without any separate sync job to maintain. continue-on-error so
      # a revoked/expired token for the upstream repo degrades to running
      # whatever the fork last had, rather than failing the whole scrape.
      - name: Sync fork with upstream
        continue-on-error: true
        run: |
          git remote add upstream https://x-access-token:${{ secrets.REPO_PAT }}@github.com/rama-gorantla/price-app-mobile.git
          git fetch upstream main
          git reset --hard upstream/main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: scrapers
        run: npm install

      - name: Install Chromium
        working-directory: scrapers
        run: npx playwright install --with-deps chromium

      - name: Run Blinkit scraper
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run scrape:blinkit
