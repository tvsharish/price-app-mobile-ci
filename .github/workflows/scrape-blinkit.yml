name: Scrape Blinkit prices

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    # This repo is public purely so its Actions minutes are free (private-repo
    # minutes are capped at 2,000/month on GitHub Free, and the real
    # price-app-mobile repo blew through that). The actual code lives in
    # tvsharish's own fork of it (not the rama-gorantla original) so this
    # pipeline stays usable even if collaborator access to the original is
    # ever lost — see the sync step below and README.md.
    #
    # The original assumption was that Blinkit needed TLS impersonation and a
    # paid proxy (Cloudflare-style 403 on a plain fetch). That was wrong then
    # — stealth-Playwright alone got through fine for months. But since
    # 2026-09-02, Cloudflare hard-403s every request specifically from
    # GitHub's IP range ("sorry, you have been blocked!"), confirmed by the
    # exact same code succeeding immediately from a home connection — same
    # root cause as Zepto's CloudFront block, different site. Runs on the
    # same self-hosted runner (zepto-home) as Zepto for that reason; the
    # label name predates Blinkit needing this too.
    runs-on: [self-hosted, zepto-home]
    steps:
      # Plain git clone instead of actions/checkout@v4 — see scrape-zepto.yml
      # for why (that action's own cleanup reliably throws EBUSY on this
      # Windows runner).
      - name: Checkout fork
        shell: powershell
        run: |
          if (Test-Path repo) { Remove-Item -Recurse -Force repo }
          git clone --depth 1 https://x-access-token:${{ secrets.REPO_PAT }}@github.com/tvsharish/price-app-mobile.git repo

      - name: Sync fork with upstream
        continue-on-error: true
        shell: powershell
        working-directory: repo
        run: |
          git remote add upstream https://x-access-token:${{ secrets.REPO_PAT }}@github.com/rama-gorantla/price-app-mobile.git
          git fetch upstream main
          git reset --hard upstream/main

      - name: Install dependencies
        working-directory: repo/scrapers
        shell: powershell
        run: npm install

      - name: Install Chromium
        working-directory: repo/scrapers
        shell: powershell
        run: npx playwright install chromium

      - name: Run Blinkit scraper
        working-directory: repo/scrapers
        shell: powershell
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run scrape:blinkit
