name: Scrape Zepto prices

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    # This repo is public purely so its Actions minutes are free — see
    # README.md. The real code lives in tvsharish's own fork of the private
    # rama-gorantla repo (checked out below), kept current via the sync step,
    # so this pipeline stays usable even if collaborator access to the
    # original is ever lost.
    #
    # Runs on a self-hosted runner (tvsharish's own machine, label
    # zepto-home) instead of GitHub-hosted ubuntu-latest — Zepto's category
    # pages return a CloudFront 403 from every GitHub Actions runner IP
    # tested, but work fine from a home connection. Every other workflow in
    # this repo stays on ubuntu-latest; only Zepto needs this. If
    # zepto-home-runner isn't online when this fires, the job just queues
    # until it is (or until the run is cancelled) rather than failing.
    runs-on: [self-hosted, zepto-home]
    steps:
      # Plain git clone instead of actions/checkout@v4 — that action's own
      # post-job temp-directory cleanup reliably throws
      # "EBUSY: resource busy or locked" on this Windows runner (a known
      # actions/checkout-on-Windows issue, most likely antivirus/indexer
      # briefly locking a file it's trying to delete), failing the whole job
      # even though the checkout itself had already succeeded. A plain clone
      # has no such cleanup step to race.
      - name: Checkout fork
        shell: bash
        run: |
          rm -rf repo
          git clone --depth 1 https://x-access-token:${{ secrets.REPO_PAT }}@github.com/tvsharish/price-app-mobile.git repo

      - name: Sync fork with upstream
        continue-on-error: true
        shell: bash
        working-directory: repo
        run: |
          git remote add upstream https://x-access-token:${{ secrets.REPO_PAT }}@github.com/rama-gorantla/price-app-mobile.git
          git fetch upstream main
          git reset --hard upstream/main

      - name: Install dependencies
        working-directory: repo/scrapers
        shell: bash
        run: npm install

      - name: Install Chromium
        working-directory: repo/scrapers
        shell: bash
        run: npx playwright install chromium

      - name: Run Zepto scraper
        working-directory: repo/scrapers
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run scrape:zepto
