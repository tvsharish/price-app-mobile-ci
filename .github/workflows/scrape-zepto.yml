name: Scrape Zepto prices

on:
  # Was paused 2026-09-20 after CloudFront started returning a 429 (rate
  # limit) to the home IP on every request since ~Sept 9, made worse by this
  # schedule firing every 3 hours for 11 days regardless (a sliding-window
  # limiter reads that as continued abuse and keeps extending rather than
  # ever letting expire). Root cause turned out to be broader than the 429
  # itself: category pages were also failing an AWS WAF JS challenge
  # (status 202, x-amzn-waf-action: challenge, empty body) specifically
  # under headless Chromium — confirmed live by getting a real, fully
  # populated page on the very first request once run headful, with the
  # same stealth args and same machine that reliably failed under headless.
  # scrapers/zepto/lib.mjs now launches headful by default (LAUNCH_HEADLESS)
  # and stops a run immediately on any 429 instead of burning through all 28
  # categories, so re-enabling this schedule shouldn't repeat either mistake.
  # Re-enabled 2026-09-20 after a clean local run through 10+ categories.
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

# At most one run at a time, and at most one waiting behind it: when a newer
# scheduled run is queued, GitHub cancels the older still-pending one. Without
# this, every 3-hour tick queued its own run while the runner was offline (the
# runner only exists while run.cmd is open on the home PC), and 6 of the last 14
# runs sat queued for 24 hours until GitHub cancelled them.
concurrency:
  group: scrape-zepto
  cancel-in-progress: false

jobs:
  scrape:
    # This repo is public purely so its Actions minutes are free — see
    # README.md. The real code lives in tvsharish's own fork of the private
    # rama-gorantla repo (checked out below), kept current via the sync step,
    # so this pipeline stays usable even if collaborator access to the
    # original is ever lost.
    #
    # Runs on a self-hosted runner (tvsharish's own machine, label
    # zepto-home) instead of GitHub-hosted ubuntu-latest — Zepto's category
    # pages return a CloudFront 403 from every GitHub Actions runner IP
    # tested, but work fine from a home connection. Every other workflow in
    # this repo stays on ubuntu-latest; only Zepto needs this. If
    # zepto-home-runner isn't online when this fires, the job just queues
    # until it is (or until the run is cancelled) rather than failing.
    #
    # This runner isn't installed as a Windows service — it only runs while
    # someone has run.cmd open in an interactive session on that machine.
    # That's actually required now, not just incidental: headful Chromium
    # (see above) needs a real desktop session to render into, which a
    # service account running in Session 0 wouldn't have.
    runs-on: [self-hosted, zepto-home]
    # A healthy sweep takes 1-20 min (last 14 runs). Four of them instead ran
    # 7-20 hours before being cancelled by hand — 45 min is generous headroom that
    # still frees the (single) runner when a headful browser hangs.
    timeout-minutes: 45
    steps:
      # Plain git clone instead of actions/checkout@v4 — that action's own
      # post-job temp-directory cleanup reliably throws
      # "EBUSY: resource busy or locked" on this Windows runner (a known
      # actions/checkout-on-Windows issue, most likely antivirus/indexer
      # briefly locking a file it's trying to delete), failing the whole job
      # even though the checkout itself had already succeeded. A plain clone
      # has no such cleanup step to race.
      #
      # PowerShell, not bash: this machine has WSL installed alongside Git
      # Bash, and `shell: bash` resolved to WSL's bash.exe, which mangles
      # Windows-style paths (stripped every backslash in the runner's own
      # temp script path, "No such file or directory"). PowerShell is
      # unambiguous on a Windows runner.
      - name: Checkout fork
        shell: powershell
        run: |
          if (Test-Path repo) { Remove-Item -Recurse -Force repo }
          git clone --depth 1 https://x-access-token:${{ secrets.REPO_PAT }}@github.com/tvsharish/price-app-mobile.git repo

      - name: Sync fork with upstream
        continue-on-error: true
        shell: powershell
        working-directory: repo
        run: |
          git remote add upstream https://x-access-token:${{ secrets.REPO_PAT }}@github.com/rama-gorantla/price-app-mobile.git
          git fetch upstream main
          git reset --hard upstream/main

      - name: Install dependencies
        working-directory: repo/scrapers
        shell: powershell
        run: npm install

      - name: Install Chromium
        working-directory: repo/scrapers
        shell: powershell
        run: npx playwright install chromium

      - name: Run Zepto scraper
        working-directory: repo/scrapers
        shell: powershell
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run scrape:zepto
