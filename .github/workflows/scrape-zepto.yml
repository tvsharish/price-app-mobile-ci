name: Scrape Zepto prices

on:
  # PAUSED 2026-09-20: CloudFront has been returning a 429 (rate limit, not
  # the original 403 block this runner exists for) to the home IP on every
  # request since ~Sept 9 - confirmed live via a saved screenshot/HTML
  # (a genuinely blank page) and the raw response (status 429, empty body,
  # x-cache: Error from cloudfront). This workflow kept firing every 3
  # hours for 11 days regardless, which a sliding-window rate limiter would
  # read as continued abuse and likely kept extending rather than ever
  # letting expire - the exact opposite of what a cooldown needs.
  #
  # scrapers/zepto/lib.mjs now stops a run immediately on the first 429
  # instead of working through all 28 categories, so re-enabling this
  # schedule later won't repeat the same mistake at the same scale - but a
  # real cooldown needs NO traffic at all for a while, which a live
  # schedule (even a lighter one) can't guarantee. Manually run this via
  # workflow_dispatch after at least 24-48h of quiet to test whether the
  # 429 has cleared before restoring the schedule below.
  #
  # schedule:
  #   - cron: '0 */3 * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    # This repo is public purely so its Actions minutes are free — see
    # README.md. The real code lives in tvsharish's own fork of the private
    # rama-gorantla repo (checked out below), kept current via the sync step,
    # so this pipeline stays usable even if collaborator access to the
    # original is ever lost.
    #
    # Runs on a self-hosted runner (tvsharish's own machine, label
    # zepto-home) instead of GitHub-hosted ubuntu-latest — Zepto's category
    # pages return a CloudFront 403 from every GitHub Actions runner IP
    # tested, but work fine from a home connection. Every other workflow in
    # this repo stays on ubuntu-latest; only Zepto needs this. If
    # zepto-home-runner isn't online when this fires, the job just queues
    # until it is (or until the run is cancelled) rather than failing.
    runs-on: [self-hosted, zepto-home]
    steps:
      # Plain git clone instead of actions/checkout@v4 — that action's own
      # post-job temp-directory cleanup reliably throws
      # "EBUSY: resource busy or locked" on this Windows runner (a known
      # actions/checkout-on-Windows issue, most likely antivirus/indexer
      # briefly locking a file it's trying to delete), failing the whole job
      # even though the checkout itself had already succeeded. A plain clone
      # has no such cleanup step to race.
      #
      # PowerShell, not bash: this machine has WSL installed alongside Git
      # Bash, and `shell: bash` resolved to WSL's bash.exe, which mangles
      # Windows-style paths (stripped every backslash in the runner's own
      # temp script path, "No such file or directory"). PowerShell is
      # unambiguous on a Windows runner.
      - name: Checkout fork
        shell: powershell
        run: |
          if (Test-Path repo) { Remove-Item -Recurse -Force repo }
          git clone --depth 1 https://x-access-token:${{ secrets.REPO_PAT }}@github.com/tvsharish/price-app-mobile.git repo

      - name: Sync fork with upstream
        continue-on-error: true
        shell: powershell
        working-directory: repo
        run: |
          git remote add upstream https://x-access-token:${{ secrets.REPO_PAT }}@github.com/rama-gorantla/price-app-mobile.git
          git fetch upstream main
          git reset --hard upstream/main

      - name: Install dependencies
        working-directory: repo/scrapers
        shell: powershell
        run: npm install

      - name: Install Chromium
        working-directory: repo/scrapers
        shell: powershell
        run: npx playwright install chromium

      - name: Run Zepto scraper
        working-directory: repo/scrapers
        shell: powershell
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run scrape:zepto
